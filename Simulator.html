<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微光 · 深夜说给谁听</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#110d16; --surface:#1a1520; --surface-2:#221b29; --surface-3:#2a2231;
  --border:#312838; --text:#f2ecf4; --text-muted:#948b9c; --text-faint:#6b6272; --accent:#b8607a;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans SC',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden;}
.serif{font-family:'Noto Serif SC','Songti SC',serif;}
button,select,textarea,input{font-family:inherit;}
#app{display:flex;height:100vh;position:relative;}

.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(600px 400px at 85% 8%, var(--glow-color, #b8607a) 0%, transparent 70%);opacity:0.10;transition:background 1.2s ease;animation:breathe 8s ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:0.08;}50%{opacity:0.16;}}

#sidebar{width:280px;min-width:280px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:2;position:relative;transition:margin-left .25s ease;}
#sidebar.collapsed{margin-left:-280px;}
.brand{padding:24px 20px 12px;}
.brand h1{font-size:22px;font-weight:700;letter-spacing:1px;}
.brand p{font-size:12px;color:var(--text-faint);margin-top:4px;letter-spacing:2px;text-transform:uppercase;}
.nav-list{padding:6px 10px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:12px;cursor:pointer;font-size:13.5px;color:var(--text-muted);transition:background .15s ease;}
.nav-item:hover{background:var(--surface-2);color:var(--text);}
.nav-item.active{background:var(--surface-2);color:var(--text);}
.nav-icon{width:20px;text-align:center;flex-shrink:0;}
.nav-divider{height:1px;background:var(--border);margin:8px 16px;}
.persona-list{flex:1;overflow-y:auto;padding:2px 10px 8px;}
.persona-item{display:flex;gap:12px;align-items:center;padding:12px 10px;border-radius:12px;cursor:pointer;transition:background .15s ease;margin-bottom:2px;position:relative;}
.persona-item:hover{background:var(--surface-2);}
.persona-item.active{background:var(--surface-2);}
.p-avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif SC',serif;font-weight:700;font-size:16px;flex-shrink:0;color:#100c14;position:relative;}
.unread-dot{position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);}
.p-meta{min-width:0;flex:1;}
.p-name{font-size:14px;font-weight:500;}
.p-preview{font-size:12px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.p-del{display:none;background:none;border:none;color:var(--text-faint);font-size:16px;cursor:pointer;padding:4px;flex-shrink:0;}
.persona-item:hover .p-del{display:block;}
.p-del:hover{color:var(--accent);}
.add-persona-btn{display:flex;align-items:center;gap:10px;padding:12px 10px;margin:4px 2px 8px;border:1px dashed var(--border);border-radius:12px;cursor:pointer;color:var(--text-muted);font-size:13px;transition:all .15s ease;}
.add-persona-btn:hover{border-color:var(--accent);color:var(--text);}
.add-persona-btn .plus{width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.sidebar-foot{padding:14px 20px;border-top:1px solid var(--border);font-size:11px;color:var(--text-faint);line-height:1.6;}

#main{flex:1;display:flex;flex-direction:column;min-width:0;z-index:1;position:relative;}

#home-view,#gallery-view,#moments-view{display:none;flex-direction:column;height:100%;overflow-y:auto;padding:28px 32px;}
.view-head{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
#menu-toggle-home,#menu-toggle-gallery{display:none;background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer;}
.view-title{font-family:'Noto Serif SC',serif;font-size:22px;}
.view-sub{font-size:12.5px;color:var(--text-faint);margin-bottom:22px;}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
.p-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:border-color .15s ease;position:relative;}
.p-card:hover{border-color:var(--accent);}
.pc-top{display:flex;gap:12px;align-items:center;margin-bottom:12px;}
.pc-meta .pc-name{font-size:14.5px;font-weight:500;}
.pc-meta .pc-tag{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
.pc-stage{font-size:11px;color:var(--text-faint);margin-bottom:6px;}
.pc-bar{height:4px;background:var(--surface-3);border-radius:2px;overflow:hidden;margin-bottom:10px;}
.pc-bar-fill{height:100%;border-radius:2px;}
.pc-preview{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.group-card{background:var(--surface);border:1px dashed var(--border);border-radius:14px;padding:16px;cursor:pointer;display:flex;align-items:center;gap:12px;margin-bottom:20px;transition:border-color .15s ease;}
.group-card:hover{border-color:var(--accent);}
.group-stack{display:flex;}
.group-stack .p-avatar{width:34px;height:34px;font-size:12px;margin-left:-10px;border:2px solid var(--surface);}
.group-stack .p-avatar:first-child{margin-left:0;}

.mem-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:12px;}
.mem-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.mem-who{font-size:12.5px;color:var(--text-muted);}
.mem-label{font-size:11px;color:var(--text-faint);letter-spacing:2px;text-transform:uppercase;}
.mem-text{font-family:'Noto Serif SC',serif;font-style:italic;color:var(--text-muted);line-height:1.8;font-size:13.5px;}
.mem-empty{color:var(--text-faint);font-size:13px;padding:40px 0;text-align:center;}

.moment-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:14px;}
.moment-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.moment-head .p-avatar{width:36px;height:36px;font-size:14px;}
.moment-name{font-size:13.5px;font-weight:500;}
.moment-time{font-size:11px;color:var(--text-faint);margin-top:1px;}
.moment-text{font-size:14px;line-height:1.75;color:var(--text);margin-bottom:12px;}
.moment-actions{display:flex;gap:16px;padding-top:8px;border-top:1px solid var(--border);}
.moment-action{background:none;border:none;color:var(--text-faint);font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:5px;}
.moment-action:hover{color:var(--text);}
.moment-action.liked{color:var(--accent);}
.moment-comments{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px;}
.moment-comment{font-size:12.5px;line-height:1.6;color:var(--text-muted);}
.moment-comment .c-name{color:var(--text);font-weight:500;}
.moment-comment-input{display:none;gap:8px;margin-top:10px;}
.moment-comment-input.open{display:flex;}
.moment-comment-input input{flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:8px 12px;font-size:12.5px;outline:none;}
.moment-comment-input input:focus{border-color:var(--accent);}
.moment-comment-input button{background:var(--accent);border:none;color:#fff;border-radius:10px;padding:0 14px;font-size:12.5px;cursor:pointer;}

#chat-shell{display:flex;flex-direction:column;height:100%;}
#chat-header{display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--border);background:rgba(26,21,32,0.6);backdrop-filter:blur(6px);flex-wrap:wrap;}
#menu-toggle{display:none;background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer;padding:4px;}
.glow-avatar{position:relative;width:40px;height:40px;flex-shrink:0;}
.glow-avatar::before{content:'';position:absolute;inset:-8px;border-radius:50%;background:var(--accent);opacity:0.35;filter:blur(10px);animation:pulse 3.2s ease-in-out infinite;}
.glow-avatar .p-avatar{position:relative;width:40px;height:40px;font-size:15px;}
@keyframes pulse{0%,100%{opacity:0.25;transform:scale(0.9);}50%{opacity:0.5;transform:scale(1.08);}}
#header-meta{flex:1;min-width:160px;}
#header-name{font-size:16px;font-weight:500;cursor:pointer;}
#header-stage-row{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap;}
#header-stage{font-size:11px;color:var(--text-faint);white-space:nowrap;}
#header-days{font-size:11px;color:var(--text-faint);white-space:nowrap;}
.stage-bar{width:60px;height:4px;background:var(--surface-3);border-radius:2px;overflow:hidden;flex-shrink:0;}
.stage-bar-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s ease;}
.head-btn{background:none;border:1px solid var(--border);color:var(--text-muted);font-size:12px;padding:6px 12px;border-radius:20px;cursor:pointer;transition:all .15s ease;white-space:nowrap;}
.head-btn:hover{border-color:var(--accent);color:var(--text);}
.head-btn:disabled{opacity:.45;cursor:default;}
.head-btn:disabled:hover{border-color:var(--border);color:var(--text-muted);}
#header-actions{display:flex;gap:8px;position:relative;flex-wrap:wrap;}

#settings-pop{position:absolute;top:44px;right:0;width:250px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px;display:none;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.4);}
#settings-pop.open{display:block;}
#settings-pop label{display:block;font-size:11px;color:var(--text-faint);margin:10px 0 4px;}
#settings-pop label:first-child{margin-top:0;}
#settings-pop select{width:100%;background:var(--surface-3);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 8px;font-size:12.5px;outline:none;}

#messages{flex:1;overflow-y:auto;padding:28px 24px;display:flex;flex-direction:column;gap:16px;}
.msg-row{display:flex;max-width:72%;flex-direction:column;}
.msg-row.user{align-self:flex-end;align-items:flex-end;}
.msg-row.assistant{align-self:flex-start;align-items:flex-start;}
.msg-speaker{font-size:11px;color:var(--text-faint);margin-bottom:3px;padding:0 4px;}
.bubble{padding:12px 16px;border-radius:16px;font-size:14.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;}
.msg-row.assistant .bubble{background:var(--surface-2);border-left:2px solid var(--accent);border-radius:4px 16px 16px 16px;}
.msg-row.user .bubble{background:var(--accent);color:#fff;border-radius:16px 4px 16px 16px;}
.msg-time{font-size:10px;color:var(--text-faint);margin-top:4px;padding:0 4px;}

.story-row{align-self:center;max-width:84%;width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;margin:6px 0;}
.story-label{font-size:11px;letter-spacing:3px;color:var(--text-faint);text-transform:uppercase;}
.story-card{font-family:'Noto Serif SC',serif;font-size:14px;line-height:1.9;color:var(--text-muted);text-align:center;font-style:italic;padding:6px 10px;}
.story-divider{width:36px;height:1px;background:var(--border);}

.event-row{align-self:center;margin:2px 0;}
.event-pill{font-size:11.5px;color:var(--text-faint);background:var(--surface-2);border:1px solid var(--border);padding:5px 14px;border-radius:20px;}

.typing{display:flex;gap:4px;padding:14px 16px;background:var(--surface-2);border-left:2px solid var(--accent);border-radius:4px 16px 16px 16px;width:fit-content;}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--text-faint);animation:blink 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:0.3;}40%{opacity:1;}}

#input-area{padding:16px 24px 22px;border-top:1px solid var(--border);}
#input-row{display:flex;gap:10px;align-items:flex-end;background:var(--surface-2);border:1px solid var(--border);border-radius:18px;padding:8px 8px 8px 16px;}
#input-row:focus-within{border-color:var(--accent);}
#msg-input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14.5px;line-height:1.6;resize:none;max-height:120px;padding:8px 0;}
#msg-input::placeholder{color:var(--text-faint);}
#send-btn{background:var(--accent);border:none;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .15s ease;}
#send-btn:disabled{opacity:0.4;cursor:default;}
#send-btn svg{width:16px;height:16px;}

::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

.modal-overlay{position:fixed;inset:0;background:rgba(8,6,10,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:440px;max-height:86vh;overflow-y:auto;padding:24px;}
.modal h2{font-family:'Noto Serif SC',serif;font-size:19px;margin-bottom:18px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px;}
.field input[type=text],.field textarea,.field select{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 12px;font-size:13.5px;outline:none;resize:vertical;}
.field input[type=text]:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);}
.field textarea{min-height:64px;line-height:1.6;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.swatches{display:flex;gap:8px;flex-wrap:wrap;}
.swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
.swatch.selected{border-color:var(--text);}
.modal-actions{display:flex;gap:10px;margin-top:20px;}
.modal-actions button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--border);background:none;color:var(--text);font-size:13.5px;cursor:pointer;}
.modal-actions .primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.modal-actions button:hover{opacity:.9;}

.gift-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.gift-card{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px 12px;cursor:pointer;text-align:center;transition:border-color .15s ease;}
.gift-card:hover{border-color:var(--accent);}
.gift-icon{font-size:22px;margin-bottom:6px;}
.gift-name{font-size:13px;}
.gift-pts{font-size:11px;color:var(--text-faint);margin-top:2px;}

.check-row{display:flex;align-items:center;gap:10px;padding:10px 6px;border-radius:10px;cursor:pointer;}
.check-row:hover{background:var(--surface-2);}
.check-row input{width:16px;height:16px;accent-color:var(--accent);}

.profile-head{display:flex;gap:14px;align-items:center;margin-bottom:16px;}
.profile-head .p-avatar{width:56px;height:56px;font-size:20px;}
.profile-name{font-size:18px;font-weight:500;}
.profile-tag{font-size:12.5px;color:var(--text-faint);margin-top:3px;}
.trait-row{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 16px;}
.trait-chip{font-size:11.5px;padding:4px 10px;border-radius:20px;background:var(--surface-2);color:var(--text-muted);border:1px solid var(--border);}
.profile-bio{font-size:13.5px;line-height:1.9;color:var(--text-muted);margin-bottom:16px;}
.profile-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-box{background:var(--surface-2);border-radius:10px;padding:10px 12px;}
.stat-label{font-size:10.5px;color:var(--text-faint);}
.stat-val{font-size:13.5px;margin-top:3px;}

.bottom-tabbar{display:none;position:fixed;left:0;right:0;bottom:0;height:58px;background:var(--surface);border-top:1px solid var(--border);z-index:5;}
.bt-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:var(--text-faint);font-size:10.5px;cursor:pointer;position:relative;}
.bt-tab .bt-icon{font-size:19px;line-height:1;}
.bt-tab.active{color:var(--accent);}
.bt-dot{position:absolute;top:4px;right:calc(50% - 16px);width:7px;height:7px;border-radius:50%;background:var(--accent);}

@media (max-width:720px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;z-index:10;margin-left:-280px;box-shadow:0 0 40px rgba(0,0,0,.4);}
  #sidebar.open{margin-left:0;}
  #menu-toggle,#menu-toggle-home,#menu-toggle-gallery,#menu-toggle-moments{display:none;}
  .msg-row{max-width:86%;}
  .bottom-tabbar{display:flex;}
  #home-view,#gallery-view,#moments-view{padding-bottom:74px;}
  #input-area{padding-bottom:74px;}
}
</style>
</head>
<body>
<div class="ambient" id="ambient"></div>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><h1 class="serif">微光</h1><p>深夜 · 说给谁听</p></div>
    <div class="nav-list">
      <div class="nav-item" id="nav-home"><span class="nav-icon">⌂</span>首页总览</div>
      <div class="nav-item" id="nav-group"><span class="nav-icon">◎</span>群聊</div>
      <div class="nav-item" id="nav-moments"><span class="nav-icon">▣</span>朋友圈</div>
      <div class="nav-item" id="nav-gallery"><span class="nav-icon">✦</span>回忆相册</div>
    </div>
    <div class="nav-divider"></div>
    <div class="persona-list" id="persona-list"></div>
    <div class="sidebar-foot">对话与剧情由 AI 生成，用于陪伴与放松，请理性看待。</div>
  </aside>

  <main id="main">
    <div id="home-view">
      <div class="view-head"><button id="menu-toggle-home">☰</button><div class="view-title serif">首页</div></div>
      <div class="view-sub">所有人的状态都在这里，点开谁就接着聊。</div>
      <div id="home-group-card"></div>
      <div class="card-grid" id="home-grid"></div>
    </div>

    <div id="moments-view">
      <div class="view-head"><button id="menu-toggle-moments">☰</button><div class="view-title serif">朋友圈</div><button class="head-btn" id="moments-refresh-btn" style="margin-left:auto;">刷新动态</button></div>
      <div class="view-sub">他们的日常，点个赞或者留句话。</div>
      <div id="moments-list"></div>
    </div>

    <div id="gallery-view">
      <div class="view-head"><button id="menu-toggle-gallery">☰</button><div class="view-title serif">回忆相册</div></div>
      <div class="view-sub">和每个人一起解锁的剧情瞬间，都收在这里。</div>
      <div id="gallery-list"></div>
    </div>

    <div id="chat-shell">
      <div id="chat-header">
        <button id="menu-toggle" aria-label="切换列表">☰</button>
        <div class="glow-avatar"><div class="p-avatar" id="header-avatar"></div></div>
        <div id="header-meta">
          <div id="header-name"></div>
          <div id="header-stage-row">
            <span id="header-stage"></span>
            <div class="stage-bar" id="stage-bar-wrap"><div class="stage-bar-fill" id="stage-bar-fill"></div></div>
            <span id="header-days"></span>
          </div>
        </div>
        <div id="header-actions">
          <button class="head-btn" id="profile-btn">资料</button>
          <button class="head-btn" id="checkin-btn">签到</button>
          <button class="head-btn" id="gift-btn">送礼物</button>
          <button class="head-btn" id="settings-btn">关系设置</button>
          <button class="head-btn" id="edit-group-btn" style="display:none;">编辑成员</button>
          <button class="head-btn" id="clear-btn">清空对话</button>
          <div id="settings-pop">
            <label>情感线</label>
            <select id="set-arc">
              <option value="none">平稳发展</option>
              <option value="tsundere">欲拒还迎（嘴硬心软）</option>
              <option value="orientation_shift">性向摇摆（本不心动，却被你打动）</option>
              <option value="love_at_first_sight">一见钟情</option>
            </select>
            <label>主动性（TA会不会主动找你）</label>
            <select id="set-proactivity">
              <option value="clingy">粘人型 · 很久没理TA会连环找你</option>
              <option value="balanced">适度型 · 偶尔会主动问候</option>
              <option value="reserved">高冷型 · 很少主动，忍不住才发</option>
            </select>
          </div>
        </div>
      </div>
      <div id="messages"></div>
      <div id="input-area">
        <div id="input-row">

    actions.innerHTML = '';

    okBtn.onclick = ()=>{ overlay.classList.remove('open'); resolve(); };

}

function getPersona(id){ return personas.find(p=>p.id===id); }
function getSettings(p){
  if(!data.settings[p.id]) data.settings[p.id] = { arc:p.defaultArc||'none', proactivity:p.proactivity||'balanced' };
  if(!data.settings[p.id].proactivity) data.settings[p.id].proactivity = p.proactivity||'balanced';
  return data.settings[p.id];
}
function getStageIndex(id){
  const pts = data.affection[id] || 0;
  let idx = 0;
  for(let i=0;i<STAGES.length;i++) if(pts >= STAGES[i].min) idx = i;
  return idx;
}
function todayStr(){ const d = new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function daysSince(ts){ if(!ts) return 0; return Math.max(0, Math.floor((Date.now()-ts)/86400000)); }
function formatTime(ts){ const d = new Date(ts); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); }

/* ---------- moments (朋友圈) ---------- */
const MOMENT_COOLDOWN_HOURS = 20;
function formatMomentTime(ts){
  const d = new Date(ts);
  const diffH = (Date.now()-ts)/3600000;
  if(diffH < 1) return '刚刚';
  if(diffH < 24) return Math.floor(diffH)+'小时前';
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+formatTime(ts);
}
async function generateMoment(p, opts){
  opts = opts || {};
  const prompt = '请你以'+p.name+'（'+(p.occupation||p.tag)+'）的身份，写一条朋友圈风格的动态。内容要符合你的职业和性格，可以是随手记录的日常、一句感慨、或者今天发生的一件小事，语气要口语化随意，像真的发朋友圈一样，不要写成日记体的书面语，不要用#话题标签#，不用写图片描述。只写1到2句正文，不要加称呼或问候语开头，不要提及用户。';
  const reply = await callClaude(buildSystemPrompt(p), [{role:'user', content:prompt}], 200);
  const content = reply || '今天也是平静的一天。';
  const moment = { id:'m_'+Date.now()+'_'+p.id, personaId:p.id, content, time:Date.now(), liked:false, comments:[] };
  data.moments.unshift(moment);
  data.lastMomentAt[p.id] = Date.now();
  data.moments = data.moments.slice(0, 60);

  const others = personas.filter(o=>o.id!==p.id);
  if(others.length && Math.random() < 0.3){
    const commenter = others[Math.floor(Math.random()*others.length)];
    try{
      const cPrompt = '你看到"'+p.name+'"发了一条朋友圈，内容是："'+content+'"。请你以'+commenter.name+'的身份，在评论区留一句简短、符合你自己性格的评论，可以调侃、较劲、关心或者随口附和，不要写称呼开头，只写这一句评论。';
      const cReply = await callClaude(buildSystemPrompt(commenter), [{role:'user', content:cPrompt}], 150);
      if(cReply) moment.comments.push({ who:'npc', personaId:commenter.id, name:commenter.name, content:cReply, time:Date.now()+1 });
    }catch(e){}
  }
  await saveAll();
  return moment;
}
async function checkMoments(){
  let generated = 0;
  const shuffled = personas.slice().sort(()=> Math.random()-0.5);
  for(const p of shuffled){
    if(generated >= 2) break;
    const hoursSince = (Date.now() - (data.lastMomentAt[p.id]||0)) / 3600000;
    if(hoursSince < MOMENT_COOLDOWN_HOURS) continue;
    if(Math.random() > 0.5) continue;
    await generateMoment(p);
    generated++;
  }
  if(el('#moments-view').style.display!=='none') renderMoments();
}
async function forceGenerateMoment(){
  const eligible = personas.filter(p=> (Date.now()-(data.lastMomentAt[p.id]||0))/3600000 >= 1);
  const pool = eligible.length ? eligible : personas;
  const p = pool[Math.floor(Math.random()*pool.length)];
  await generateMoment(p);
}

function renderMoments(){
  const list = el('#moments-list');
  list.innerHTML = '';
  if(!data.moments.length){ list.innerHTML = '<div class="mem-empty">还没有人发动态，点右上角"刷新动态"试试，或者过一阵子再回来看看。</div>'; return; }
  data.moments.forEach(m=>{
    const p = getPersona(m.personaId);
    if(!p) return;
    const card = document.createElement('div');
    card.className = 'moment-card';
    card.innerHTML =
      '<div class="moment-head"><div class="p-avatar" style="background:'+p.color+'">'+p.avatar+'</div><div><div class="moment-name">'+p.name+'</div><div class="moment-time"></div></div></div>'+
      '<div class="moment-text"></div>'+
      '<div class="moment-actions">'+
        '<button class="moment-action'+(m.liked?' liked':'')+'" data-act="like">'+(m.liked?'♥':'♡')+' 喜欢'+(m.liked?' · 1':'')+'</button>'+
        '<button class="moment-action" data-act="comment">评论'+(m.comments.length?' · '+m.comments.length:'')+'</button>'+
      '</div>'+
      '<div class="moment-comments" style="'+(m.comments.length?'':'display:none;')+'"></div>'+
      '<div class="moment-comment-input"><input type="text" placeholder="说句话…" maxlength="80"><button>发送</button></div>';
    card.querySelector('.moment-time').textContent = formatMomentTime(m.time);
    card.querySelector('.moment-text').textContent = m.content;
    const commentsWrap = card.querySelector('.moment-comments');
    m.comments.forEach(c=>{
      const row = document.createElement('div'); row.className='moment-comment';
      const nm = document.createElement('span'); nm.className='c-name'; nm.textContent = (c.who==='user' ? '我' : c.name) + '：';
      row.appendChild(nm);
      row.appendChild(document.createTextNode(c.content));
      commentsWrap.appendChild(row);
    });
    card.querySelector('[data-act="like"]').addEventListener('click', ()=> toggleMomentLike(m.id));
    card.querySelector('[data-act="comment"]').addEventListener('click', ()=>{
      card.querySelector('.moment-comment-input').classList.toggle('open');
    });
    const inputRow = card.querySelector('.moment-comment-input');
    const inputEl2 = inputRow.querySelector('input');
    const sendBtn2 = inputRow.querySelector('button');
    const submit = ()=>{
      const text = inputEl2.value.trim();
      if(!text) return;
      inputEl2.value = '';
      submitMomentComment(m.id, text);
    };
    sendBtn2.addEventListener('click', submit);
    inputEl2.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } });
    list.appendChild(card);
  });
}
async function toggleMomentLike(momentId){
  const m = data.moments.find(x=>x.id===momentId);
  if(!m) return;
  m.liked = !m.liked;
  const p = getPersona(m.personaId);
  if(m.liked && p) addAffection(p, 2);
  renderMoments();
  await saveAll();
}
async function submitMomentComment(momentId, text){
  const m = data.moments.find(x=>x.id===momentId);
  if(!m) return;
  const p = getPersona(m.personaId);
  m.comments.push({ who:'user', content:text, time:Date.now() });
  renderMoments();
  await saveAll();
  if(!p) return;
  try{
    const prompt = '你在朋友圈发的动态是："'+m.content+'"。我评论说："'+text+'"。请你以'+p.name+'的身份回复这条评论，语气自然，符合你自己的性格，不要写称呼开头。只写这一句回复。';
    const reply = await callClaude(buildSystemPrompt(p), [{role:'user', content:prompt}], 150);
    if(reply){
      m.comments.push({ who:'npc', personaId:p.id, name:p.name, content:reply, time:Date.now() });
      addAffection(p, 3);
      renderMoments();
      renderHeader();
      await saveAll();
    }
  }catch(e){}
}

/* ---------- persistence ---------- */
async function loadState(){
  let customPersonas = [];
  try{
    const res = await window.storage.get('weiguang-data', false);
    if(res){
      const parsed = JSON.parse(res.value);
      data = Object.assign({chats:{}, affection:{}, settings:{}, lastCheckin:{}, metAt:{}, lastUserAt:{}, lastProactiveAt:{}, unread:{}, lastJealousyAt:{}, moments:[], lastMomentAt:{}, group:{participantIds:[],messages:[],lastActivityAt:0,lastProactiveAt:0,unread:false}}, parsed);
      if(!data.group) data.group = { participantIds:[], messages:[], lastActivityAt:0, lastProactiveAt:0, unread:false };
      if(data.group.lastActivityAt===undefined) data.group.lastActivityAt = data.group.messages.length ? data.group.messages[data.group.messages.length-1].time : 0;
      customPersonas = parsed.customPersonas || [];
    }
  }catch(e){}
  personas = BUILTIN_PERSONAS.concat(customPersonas);
  personas.forEach(p=>{ if(!data.metAt[p.id]) data.metAt[p.id] = Date.now(); if(!data.lastUserAt[p.id]) data.lastUserAt[p.id] = data.metAt[p.id]; });
  currentId = personas[0].id;
}
async function saveAll(){
  const customPersonas = personas.filter(p=>p.custom);
  const payload = Object.assign({}, data, { customPersonas });
  const str = JSON.stringify(payload);
  for(let attempt=0; attempt<3; attempt++){
    try{
      await window.storage.set('weiguang-data', str, false);
      return true;
    }catch(e){
      if(attempt===2){ console.error('保存失败，已重试3次', e); return false; }
      await new Promise(r=>setTimeout(r, 350*(attempt+1)));
    }
  }
}

/* ---------- prompts ---------- */
function buildSystemPrompt(p, extraMod){
  const idx = getStageIndex(p.id);
  const stage = STAGES[idx];
  const s = getSettings(p);
  let parts = [p.system, '当前关系阶段：'+stage.label+'。'+stage.mod];
  if(p.gender && p.gender!=='不设定') parts.push('你的性别是'+p.gender+'。');
  if(p.orientation) parts.push('TA的性向设定：'+p.orientation+'。');
  if(ARC_MOD[s.arc]) parts.push(ARC_MOD[s.arc]);
  if(extraMod) parts.push(extraMod);
  parts.push(STYLE_GUARD);
  parts.push(SAFETY_MOD);
  return parts.join('\n');
}
async function callClaude(system, messages, maxTokens){
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:maxTokens, system:system, messages:messages })
  });
  const d = await response.json();
  if(d && d.content) return d.content.filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
  return '';
}
function historyFor(p){
  return (data.chats[p.id]||[]).filter(m=>m.role==='user' || m.role==='assistant').map(m=>({
    role:m.role,
    content: m.type==='gift' ? '(送给你一份礼物：'+m.giftName+')' : m.type==='checkin' ? '(来签到打卡了)' : m.content
  }));
}

    data.chats[p.id].push({ role:'story', content:text, label:stage.label, time:Date.now() });

  SWATCHES.forEach(color=>{
    const s = document.createElement('div');
    s.className = 'swatch' + (color===selectedSwatch ? ' selected' : '');
    s.style.background = color;
    s.onclick = ()=>{ selectedSwatch = color; buildSwatches(); };
    c.appendChild(s);
  });
}
function openCreateModal(){
  el('#f-name').value=''; el('#f-tag').value=''; el('#f-desc').value=''; el('#f-greeting').value='';
  el('#f-age').value=''; el('#f-occupation').value=''; el('#f-traits').value='';
  el('#f-orientation').value='男女都有可能'; el('#f-gender').value='女'; el('#f-arc').value='none'; el('#f-proactivity').value='balanced';
  selectedSwatch = SWATCHES[Math.floor(Math.random()*SWATCHES.length)];
  buildSwatches();
  el('#create-overlay').classList.add('open');
}
el('#f-cancel').addEventListener('click', ()=> el('#create-overlay').classList.remove('open'));
el('#create-overlay').addEventListener('click', (e)=>{ if(e.target.id==='create-overlay') el('#create-overlay').classList.remove('open'); });

el('#f-save').addEventListener('click', async ()=>{
  const name = el('#f-name').value.trim();
  const desc = el('#f-desc').value.trim();
  if(!name || !desc){ await showAlert('名字和人设描述不能为空哦'); return; }
  const id = 'custom-' + Date.now() + '-' + Math.random().toString(36).slice(2,7);
  const tag = el('#f-tag').value.trim() || '自定义角色';
  const greeting = el('#f-greeting').value.trim() || ('你好，我是'+name+'。很高兴能认识你。');
  const traits = el('#f-traits').value.split(',').map(t=>t.trim()).filter(Boolean);
  const persona = {
    id, name, tag, avatar:name.charAt(0), color:selectedSwatch, custom:true,
    age: el('#f-age').value.trim(), occupation: el('#f-occupation').value.trim(),
    gender: el('#f-gender').value,
    traits, bio: desc,
    orientation: el('#f-orientation').value, system: desc, greeting, proactivity: el('#f-proactivity').value
  };
  personas.push(persona);
  data.settings[id] = { arc: el('#f-arc').value, proactivity: el('#f-proactivity').value };
  data.chats[id] = []; data.affection[id] = 0; data.metAt[id] = Date.now(); data.lastUserAt[id] = Date.now();
  await saveAll();
  el('#create-overlay').classList.remove('open');
  renderPersonaList(); renderHome();
  openPersonaChat(persona);
});

window.addEventListener('focus', ()=>{ runAllProactiveChecks(); });

(async function init(){
  await loadState();
  renderPersonaList();
  renderHome();
  showView('home');
  await runAllProactiveChecks();
  renderPersonaList(); renderHome();
})();
</script>
</body>
